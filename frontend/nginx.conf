server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: React Router owns the URL, so every path that is not
    # a real file has to return index.html. Without this, refreshing on
    # /tasks or opening a shared /user/kelvin link returns nginx's own 404
    # and the app never boots.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their content does, so they can
    # be cached indefinitely. index.html must never be, or a deploy ships
    # new assets that the cached HTML does not reference.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening. No CSP here: it belongs with the app's actual
    # Supabase and API origins, which differ per deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
