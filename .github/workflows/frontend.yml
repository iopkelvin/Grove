# Frontend CI.
#
# Replaces the single-job "Color Lint" workflow, which ran stylelint and
# nothing else — so a pull request that failed to build, or that referenced
# an undefined variable in a component, merged clean.

name: Frontend

on:
  push:
    branches: [main, development]
  # Unfiltered by base branch, so a stacked pull request still gets checked.
  # See the same note in backend.yml.
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the lockfile and manifest disagree, which
      # is the difference between CI testing what a developer has and CI
      # testing whatever npm resolved that morning.
      - run: npm ci

      - name: JavaScript lint
        run: npm run lint

      - name: Design-token lint
        run: npm run lint:colors

      - name: Unit tests
        run: npm run test:coverage

      - name: Production build
        # Values only need to be present, not real: the build inlines them
        # and nothing is executed here.
        env:
          VITE_API_URL: ""
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
