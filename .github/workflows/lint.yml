# Kelvin

name: Color Lint

on:
  pull_request:
    branches: [main, development]

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run color lint
        working-directory: frontend
        run: npm run lint:colors