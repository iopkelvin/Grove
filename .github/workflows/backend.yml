# Backend CI.
#
# Nothing checked the Python before this. The only workflow in the repo ran
# stylelint over the CSS, so a pull request could break every endpoint in the
# API and still show a green tick.

name: Backend

on:
  push:
    branches: [main, development]
  # Deliberately unfiltered by base branch. Restricting this to
  # [main, development] meant a stacked pull request — one whose base is
  # another feature branch — got no checks at all and showed an empty status
  # box, which reads as "nothing to run" rather than "nothing ran".
  pull_request:

# A new push supersedes the run already in flight for the same branch.
# Without this, pushing three times in a minute queues three full runs.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Check formatting and lint rules
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result for the other.
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.12 is what the
        # Dockerfile and Render both run.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # No DATABASE_URL and no SUPABASE_JWT_SECRET: TestingConfig ignores
        # both anyway, and leaving them unset proves the suite cannot reach
        # a real database even by accident.
        env:
          FLASK_ENV: testing
        run: pytest --cov=api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Catches the failure mode where a model changes and nobody generates
      # the migration, or a hand-written revision does not actually run.
      - name: Upgrade to head, then back down
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///ci-check.db
        run: |
          flask --app app db upgrade
          flask --app app db downgrade base
          flask --app app db upgrade

      # migrations/env.py discards an autogenerated revision that turns out
      # to be empty, so "a file appeared" is exactly equivalent to "the
      # models no longer match the migrations".
      - name: Fail if the models have drifted from the migrations
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///ci-check.db
        run: |
          before=$(ls migrations/versions/*.py | wc -l)
          flask --app app db migrate -m "drift check" --rev-id drift-check
          after=$(ls migrations/versions/*.py | wc -l)
          if [ "$after" -ne "$before" ]; then
            echo "::error::Models have changed without a migration. Run: flask --app app db migrate -m '...'"
            cat migrations/versions/drift-check*.py
            exit 1
          fi
          echo "Models and migrations agree."
